<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahoreda - Messages</title>
  <link rel="stylesheet" href="messages.css">
</head>

<body>

  <!-- TOP NAV -->
  <header class="top-nav">
    <div class="brand">
      <div class="logo">AH</div>
      <span class="brand-name">Ahoreda</span>
    </div>
    <div class="top-right-menu">

      <!-- Call Buttons -->
      <button id="voiceCallBtn" class="call-btn">📞</button>
      <button id="videoCallBtn" class="call-btn">🎥</button>
    </div>
  </header>

  <!-- CHAT AREA -->
  <main class="chat-area">

    <!-- Chat messages -->
    <div id="chatMessages">
      <p class="empty-chat">Start a conversation</p>
    </div>


    </div>

    <!-- Message input -->
    <div class="chat-input-container">
      <button id="attachBtn" class="big-attach">+</button>
      <input type="text" id="chatInput" placeholder="Type your message...">
      <button id="micBtn" class="transparent-btn">🎤</button>
      <button id="sendBtn">Send</button>
      <input type="file" id="fileInput" style="display:none;" multiple>
    </div>

  </main>

  <script src="messages.js"></script>
</body>
