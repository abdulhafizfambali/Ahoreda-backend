<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Call</title>
  <link rel="stylesheet" href="incoming.css">
</head>
<body>

<div class="incoming-container">

  <!-- Caller Info -->
  <div class="caller-info">
    <div class="avatar"></div>
    <h2 id="callerName">Anna Smith</h2>
    <p class="status">Incoming call...</p>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button id="rejectBtn" class="reject">☎️</button>
    <button id="acceptBtn" class="accept">✔</button>
  </div>

</div>

<script src="incoming.js"></script>
</body>
</html>
